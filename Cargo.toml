[package]
name = "judgelint"
version = "0.2.3"
edition = "2024"
rust-version = "1.89"
description = "Checks code against conventions written in plain English, using decision models"
repository = "https://github.com/jpcamara/judgelint"
license = "MIT"
publish = false

[dependencies]
anyhow = "1"
base64 = "0.23"
clap = { version = "4.5", features = ["derive"] }
globset = "0.4"
ignore = "0.4"
rayon = "1.11"
regex = "1.11"
rustix = { version = "1.1", default-features = false, features = ["fs", "std"] }
serde = { version = "1", features = ["derive"] }
serde-saphyr = { version = "2", default-features = false, features = ["deserialize"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.11"
ureq = { version = "3.1", default-features = false, features = ["rustls"] }

[lints.rust]
unsafe_code = "forbid"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
# Offsets and counts in the cache are arithmetic on what a file says.
overflow-checks = true
strip = true
