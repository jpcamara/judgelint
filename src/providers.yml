# Presets for the services and servers that answer System One questions.
# Any key can be overridden in .judgelint.yml; see providers.rs.
- name: typesafe
  api_base: https://api.typesafe.ai
  api_key_env: TYPESAFE_API_KEY
  model: jev-latest
  prices: {jev-latest: 0.042, jev-preview: 0.042}
- name: openrouter
  api_base: https://openrouter.ai/api
  api_key_env: OPENROUTER_API_KEY
  model: typesafe/jev-1.13
- name: celeris
  api_base: https://inference.celeris.ai/celeris-1-decision
  api_key_env: CELERIS_API_KEY
  model: celeris-1-decision
  prices: {celeris-1-decision: 0.04}
- name: cloudflare
  api_base: https://api.cloudflare.com/client/v4/accounts/${CLOUDFLARE_ACCOUNT_ID}/ai/run
  path: /@cf/cloudflare/{model}
  api_key_env: CLOUDFLARE_API_TOKEN
  model: clef
  batch_size: 64
  prices: {clef: 0.24}
- name: openai
  api_base: https://api.openai.com
  path: /v1/decisions
  protocol: decisions
  api_key_env: OPENAI_API_KEY
  model: gpt-6-luna
  prices: {gpt-6-luna: 0.10}
- name: perplexity
  api_base: https://api.perplexity.ai
  path: /v1/decisions
  api_key_env: PERPLEXITY_API_KEY
  model: pplx-decider-latest
  batch_size: 128
  prices: {pplx-decider-latest: 0.02, pplx-decider-flash-latest: 0.01}
- name: vercel
  api_base: https://ai-gateway.vercel.sh/typesafe
  api_key_env: AI_GATEWAY_API_KEY
  model: typesafe-ai/jev
- name: digitalocean
  api_base: https://inference.do-ai.run
  api_key_env: MODEL_ACCESS_KEY
  model: typesafe-jev-1.13.0
- name: upstage
  api_base: https://api.upstage.ai
  api_key_env: UPSTAGE_API_KEY
  model: solar-decide
- name: hanzo
  api_base: https://api.hanzo.ai
  path: /v1/decisions
  api_key_env: HANZO_API_KEY
  model: kai
  batch_size: 100
  prices: {kai: 0.021}
- name: foundry
  path: /providers/microsoft/v1/systemone
  auth: header:api-key
  api_key_env: AZURE_API_KEY
  needs: api_base (your Foundry resource endpoint) and model (your deployment name)
- name: databricks
  path: /ai-gateway/typesafe/v1/systemone
  auth: basic
  api_key_env: DATABRICKS_TOKEN
  needs: api_base (https://<workspace host>) and model (a Unity Catalog name)
- name: ollama
  api_base: http://localhost:11434
  batch_size: 64
  needs: model (a decision model you've pulled)
- name: llamacpp
  api_base: http://localhost:8080
- name: vllm
  api_base: http://localhost:8000
  batch_size: 64
  needs: model (the model the server runs)
- name: litellm
  api_base: http://localhost:4000
  api_key_env: LITELLM_API_KEY
  needs: model (a decision model routed by your proxy)
