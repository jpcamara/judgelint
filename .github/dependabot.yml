# Weekly pull requests for the pinned actions and the Cargo dependencies,
# each update at least two weeks old, so a bad release has time to be
# caught and pulled before it lands here.
version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14

  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 14
