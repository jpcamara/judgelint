name: Native gems

# Builds the binary on each platform, runs the tests against it, and packages
# the platform gems plus the plain one, uploaded as the run's artifacts. It
# runs on pull requests, by hand, and on v* tags. A tag also:
#
# - attests the build provenance of each binary archive and gem,
# - publishes a GitHub release with each binary, for install.sh,
# - updates the formula in jpcamara/homebrew-tap,
# - pushes the gems to RubyGems.org as a trusted publisher.
on:
  pull_request:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  native:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14, platform: arm64-darwin, target: aarch64-apple-darwin }
          - { os: macos-15-intel, platform: x86_64-darwin, target: x86_64-apple-darwin }
          - { os: ubuntu-22.04, platform: x86_64-linux, target: x86_64-unknown-linux-gnu }
          - { os: ubuntu-22.04-arm, platform: aarch64-linux, target: aarch64-unknown-linux-gnu }
    env:
      # The oldest macOS the binary runs on.
      MACOSX_DEPLOYMENT_TARGET: "11.0"
      # Install exactly what Gemfile.lock says.
      BUNDLE_FROZEN: "true"
      # Builds with cargo-auditable, which embeds the dependency list in the
      # binary, so `cargo audit bin` can check an installed one.
      AUDITABLE: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Tag builds start from scratch rather than from a cache.
      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"
          bundler-cache: ${{ !startsWith(github.ref, 'refs/tags/') }}

      - name: Install gems
        if: startsWith(github.ref, 'refs/tags/')
        run: bundle install

      - name: Install the Rust toolchain from rust-toolchain.toml
        run: |
          rustup toolchain install
          rustup show active-toolchain

      # Tag builds, which publish, skip it.
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2.9.3 # zizmor: ignore[cache-poisoning]
        if: "!startsWith(github.ref, 'refs/tags/')"

      - uses: taiki-e/install-action@1168f6810a3cb30a3514bf5756a3b7f0422c6df8 # v2.87.28
        with:
          tool: cargo-auditable@0.7.7,cargo-deny@0.20.2,zizmor@1.30.1

      - name: Lint
        if: matrix.platform == 'x86_64-linux'
        run: |
          cargo fmt --check
          cargo clippy --release --locked --all-targets -- -D warnings
          # Advisories, licenses and sources of the dependencies (deny.toml).
          cargo deny --locked check
          zizmor --offline .github/workflows

      - name: Build with the oldest Rust Cargo.toml allows
        if: matrix.platform == 'x86_64-linux'
        run: |
          version=$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml)
          rustup toolchain install "$version" --profile minimal
          cargo "+$version" check --locked --all-targets

      - name: Test
        run: bundle exec rake test

      - name: Check it needs nothing beyond the system's libraries
        run: |
          if [ "$RUNNER_OS" = macOS ]; then otool -L target/release/judgelint; else ldd target/release/judgelint; fi
          ! { otool -L target/release/judgelint 2>/dev/null || ldd target/release/judgelint; } | grep -i -E 'ssl|crypto'

      - name: Package
        run: |
          bundle exec rake gem:native
          if [ "${{ matrix.platform }}" = x86_64-linux ]; then bundle exec rake gem; fi

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gems-${{ matrix.platform }}
          path: pkg/*.gem

      - name: Archive the binary
        run: |
          mkdir -p dist
          tar --no-xattrs -czf "dist/judgelint-${{ matrix.target }}.tar.gz" -C target/release judgelint

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: binary-${{ matrix.target }}
          path: dist/*.tar.gz

  attest:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: native
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          merge-multiple: true

      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: |
            dist/*.tar.gz
            dist/*.gem

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: attest
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: binary-*
          path: dist
          merge-multiple: true

      # Uploads every asset to a draft, then publishes it, so the release is
      # complete before anyone can see it and nothing changes after. A tag that
      # already has a release, even a draft, fails here rather than replacing
      # its assets.
      - name: Release the binaries
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          cd dist
          sha256sum -- *.tar.gz > SHA256SUMS
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "::error::$GITHUB_REF_NAME already has a release, so this run leaves it alone"
            exit 1
          fi
          gh release create "$GITHUB_REF_NAME" --draft --verify-tag --title "$GITHUB_REF_NAME" --generate-notes ./*
          gh release edit "$GITHUB_REF_NAME" --draft=false

  # In the release environment, which holds the tap's deploy key.
  homebrew:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download the release's checksums
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh release download "$GITHUB_REF_NAME" --pattern SHA256SUMS --dir dist

      # It keeps the key, to push the formula; this job uploads nothing.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1 # zizmor: ignore[artipacked]
        with:
          repository: jpcamara/homebrew-tap
          ssh-key: ${{ secrets.HOMEBREW_TAP_DEPLOY_KEY }}
          path: homebrew-tap

      - name: Update the Homebrew formula
        run: |
          ruby script/homebrew-formula "${GITHUB_REF_NAME#v}" dist/SHA256SUMS > homebrew-tap/Formula/judgelint.rb
          cd homebrew-tap
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/judgelint.rb
          git diff --cached --quiet || git commit -m "judgelint ${GITHUB_REF_NAME#v}"
          git push

  # Its own job, so it can be re-run alone. It runs in the release environment,
  # which the trusted publisher on RubyGems.org names.
  rubygems:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: gems-*
          path: pkg
          merge-multiple: true

      - uses: ruby/setup-ruby@7f797815d8adceb1c412e7abefdd1ab4abc47a5f # v1.335.0
        with:
          ruby-version: "3.4"

      - uses: rubygems/configure-rubygems-credentials@dc5a8d8553e6ee01fc26761a49e99e733d17954a # v2.1.0

      - name: Push the gems
        run: |
          gems=(pkg/*.gem)
          printf '%s\n' "${gems[@]}"
          [ "${#gems[@]}" -eq 5 ] || { echo "::error::expected 4 platform gems and the plain one"; exit 1; }
          ruby script/push-gems "${gems[@]}"
